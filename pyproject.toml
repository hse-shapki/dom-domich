[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dom-domych"
version = "0.1.0"
description = "Агент дома в мессенджере MAX"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pgvector>=0.4,<1",
    "pydantic>=2.11,<3",
    "reportlab>=4.4,<5",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=25.3,<26",
    "uvicorn>=0.35,<1",
]

[project.scripts]
dom-domych-process = "dom_domych.entrypoints.processes:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pypdf>=5.4,<7",
    "pytest>=8.3,<9",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.11,<1",
    "types-reportlab>=4.4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dom_domych"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["dom_domych"]
check_untyped_defs = true
warn_unused_ignores = true
disallow_untyped_defs = true
explicit_package_bases = true
