name: dom-domych

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    DATABASE_URL: ${DATABASE_URL:?Set container DATABASE_URL with postgres host}
    FILE_STORE_DIR: /var/lib/dom-domych/files
    MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:?Set MAX_BOT_TOKEN outside Git}
    MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
    MAX_INGRESS_MODE: ${MAX_INGRESS_MODE:-webhook}
    PAYLOAD_RETENTION_DAYS: ${PAYLOAD_RETENTION_DAYS:-30}
    LLM_BASE_URL: ${LLM_BASE_URL:?Set reachable OpenAI-compatible llama-server URL}
    LLM_MODEL: ${LLM_MODEL:?Set served model alias}
    LLM_BACKEND: ${LLM_BACKEND:-openai_compatible}
    LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
    LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
    LLM_ATTEMPTS: ${LLM_ATTEMPTS:-2}
  depends_on:
    migrate:
      condition: service_completed_successfully
  volumes:
    - files_data:/var/lib/dom-domych/files
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - backend
    - egress

x-runtime: &runtime
  <<: *app
  depends_on:
    seed:
      condition: service_completed_successfully

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dom_domych_demo}
      POSTGRES_USER: dom_domych
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD outside Git}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dom_domych -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *app
    restart: "no"
    command: ["python", "-m", "scripts.seed_demo_house", "--allow-demo-database"]

  api:
    <<: *runtime
    profiles: ["webhook"]
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  outbox:
    <<: *runtime
    command: ["dom-domych-process", "outbox"]
    read_only: true
    tmpfs:
      - /tmp

  inbox:
    <<: *runtime
    command: ["dom-domych-process", "inbox"]
    read_only: true
    tmpfs:
      - /tmp

  scheduler:
    <<: *runtime
    command: ["dom-domych-process", "scheduler"]
    read_only: true
    tmpfs:
      - /tmp

  documents:
    <<: *runtime
    command: ["dom-domych-process", "documents"]
    read_only: true
    tmpfs:
      - /tmp

  maintenance:
    <<: *runtime
    command: ["dom-domych-process", "maintenance"]
    read_only: true
    tmpfs:
      - /tmp

  polling:
    <<: *runtime
    profiles: ["polling"]
    command: ["dom-domych-process", "polling"]
    read_only: true
    tmpfs:
      - /tmp

  preflight:
    <<: *runtime
    profiles: ["webhook", "polling"]
    restart: "no"
    command: ["dom-domych-preflight"]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    profiles: ["webhook"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - backend

networks:
  edge:
  egress:
  backend:
    internal: true

volumes:
  postgres_data:
  files_data:
  caddy_data:
  caddy_config:
