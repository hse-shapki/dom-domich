services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: dom_domych
      POSTGRES_USER: dom_domych
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD outside Git}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dom_domych -d dom_domych"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
