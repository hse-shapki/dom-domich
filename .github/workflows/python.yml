name: Python

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+asyncpg://dom_domych:test@127.0.0.1:5432/dom_domych_test
      TEST_DATABASE_URL: postgresql+asyncpg://dom_domych:test@127.0.0.1:5432/dom_domych_test
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_DB: dom_domych_test
          POSTGRES_USER: dom_domych
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dom_domych -d dom_domych_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.13"
      - run: uv sync --locked --python 3.13
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/dom_domych
      - run: uv run alembic upgrade head
      - run: uv run python -m scripts.seed_demo_house
      - run: uv run python -m scripts.seed_demo_house
      - run: uv run alembic check
      - run: uv run pytest
