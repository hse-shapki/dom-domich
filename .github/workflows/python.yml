name: Python

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.13"
      - run: uv sync --locked --python 3.13
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/dom_domych
      - run: uv run pytest
